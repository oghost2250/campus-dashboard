name: Send campus push reminders

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: campus-push-reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Check reminder secrets
        env:
          APP_URL: ${{ secrets.CAMPUS_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$APP_URL" || (echo "CAMPUS_APP_URL is not configured" && exit 1)
          test -n "$CRON_SECRET" || (echo "CRON_SECRET is not configured" && exit 1)
      - name: Send lecture reminders
        env:
          APP_URL: ${{ secrets.CAMPUS_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: >-
          curl --fail --silent --show-error --max-time 30 --retry 2 --retry-delay 5
          -H "Authorization: Bearer ${CRON_SECRET}"
          "${APP_URL%/}/api/cron/lecture-alarms"
      - name: Send assignment reminders
        env:
          APP_URL: ${{ secrets.CAMPUS_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: >-
          curl --fail --silent --show-error --max-time 30 --retry 2 --retry-delay 5
          -H "Authorization: Bearer ${CRON_SECRET}"
          "${APP_URL%/}/api/cron/assignment-reminders"

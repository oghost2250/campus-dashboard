services:
  db:
    image: postgres:16-alpine
    container_name: sdd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: student_dashboard
    ports:
      - "5432:5432"
    volumes:
      - sdd-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d student_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sdd-pgdata:
